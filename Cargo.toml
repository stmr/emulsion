[package]
name = "emulsion"
version = "14.0.1"
description = "A fast and minimalistic image viewer"
repository = "https://github.com/stmr/emulsion"
authors = ["Artur Barnabas <kovacs.artur.barnabas@gmail.com>", "The Emulsion Contributors"]
license = "MIT"
readme = "README.md"
edition = "2024"
build = "build.rs"

[package.metadata.bundle]
name = "Emulsion"
identifier = "io.github.stmr.emulsion"
icon = ["resource_dev/emulsion.icns"]
resources = ["LICENSE.txt"]
category = "public.app-category.photography"
short_description = "A lightweight and minimalistic image viewer"
copyright = "Copyright (c) 2020-2026 The Emulsion Contributors"
osx_minimum_system_version = "11.0"
osx_info_plist_exts = ["distribution/macos/info.plist.fragment"]
linux_exec_args = "%f"
linux_mime_types = [
    "image/jpeg",
	"image/jpg",
	"image/pjpeg",
	"image/png",
	"image/apng",
	"image/gif",
	"image/webp",
	"image/tiff",
	"image/bmp",
	"image/avif",
	"image/svg+xml",
	"image/svg",
	"image/x-png",
	"image/x-tga",
	"image/x-targa",
	"image/x-bmp",
	"image/x-icon",
	"image/vnd.microsoft.icon",
	"image/vnd.radiance",
	"image/x‑portable‑bitmap",
	"image/x‑portable‑graymap",
	"image/x‑portable‑pixmap",
	"image/x‑portable‑anymap"
]

[workspace]
members = [
    "subcrates/gelatin",
]

[profile.dev.package."*"]
opt-level = 1
[profile.dev.build-override]
opt-level = 1
[profile.release]
lto = "thin"

[features]
default = []
networking = ["ureq"]
avif = ["gelatin/avif"]
benchmark = ["gelatin/benchmark"]

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.11"
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSButton", "NSColorSpace", "NSControl", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString", "CFURL"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGGeometry", "CGImage"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageProperties", "CGImageSource", "objc2-core-graphics"] }
raw-window-handle = "0.6.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }

[dependencies]
gelatin = { path = "./subcrates/gelatin", version = "0.14" }
ureq = { version = "3.1", features = ["json"], optional = true }
directories-next = "2.0.0"
open = "5.4"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1"
rand = "0.10"
lexical-sort = "0.3.1"
trash = "5.2"
clap = { version = "4.6" }
kamadak-exif = "0.6"
arboard = { version = "3.6", features = ["wayland-data-control"] }
resvg = "0.50"
usvg = "0.50"
tiny-skia = "0.12"
moxcms = "0.8"
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
