name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  rustfmt-clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi-dev libgl1-mesa-dev libxkbcommon-dev libwayland-dev libgtk-3-dev libxdo-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features=networking -- -D warnings -A clippy::needless_late_init

  clippy-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features=networking -- -D warnings -A clippy::needless_late_init

  # The release workflow ships AVIF-enabled builds, so make sure they keep compiling.
  # dav1d is built from source by dav1d-sys (same setup as release-packages.yml).
  check-avif:
    runs-on: ubuntu-24.04
    env:
      SYSTEM_DEPS_DAV1D_LINK: static
      SYSTEM_DEPS_DAV1D_BUILD_INTERNAL: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi-dev libgl1-mesa-dev libxkbcommon-dev libwayland-dev libgtk-3-dev libxdo-dev ninja-build nasm meson
      - run: cargo check --workspace --all-targets --features=networking,avif

  build:
    needs: [rustfmt-clippy, clippy-macos]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    env:
      RUSTFLAGS: -C opt-level=0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi-dev libgl1-mesa-dev libxkbcommon-dev libwayland-dev libgtk-3-dev libxdo-dev
      - name: Build and run tests
        run: cargo test --verbose --workspace --features=networking
