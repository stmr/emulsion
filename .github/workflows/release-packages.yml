name: Build Release Packages

on:
  workflow_dispatch:
  push:
    tags:
    - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxi-dev libgl1-mesa-dev libxkbcommon-dev libwayland-dev libgtk-3-dev libxdo-dev
    - name: Run tests
      run: cargo test --workspace --locked --features=networking

  windows:
    runs-on: windows-latest
    needs: test
    env:
      EMULSION_VERSION: ${{ github.ref_name }}
      INSTALLER_NAME: ${{ format('Emulsion-Windows-{0}.exe', github.ref_name) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Print installer name
      run: |
        Write-Host $Env:INSTALLER_NAME
    - name: Install NSIS
      run: |
        choco install nsis --version=3.12.0 --no-progress -y
        "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Print NSIS version
      run: |
        Write-Host "Path: $env:PATH"
        makensis -VERSION
    - name: Fetch Prerequisites
      working-directory: ./distribution/windows/prerequisites
      run: |
        Invoke-WebRequest -UseBasicParsing -Uri 'https://aka.ms/vs/16/release/vc_redist.x64.exe' -OutFile vc_redist.x64.exe
        # The download URL always serves the latest build, so a fixed hash cannot be pinned;
        # require a valid Microsoft Authenticode signature instead.
        $sig = Get-AuthenticodeSignature vc_redist.x64.exe
        if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
          throw "vc_redist.x64.exe has an invalid or unexpected signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
        }
        Write-Host "vc_redist.x64.exe signed by $($sig.SignerCertificate.Subject)"

    - name: Install avif build dependencies (Windows)
      run: |
        choco install pkgconfiglite nasm ninja
        python -m pip install meson

        $newPath = "$($env:SystemDrive)\Program Files\NASM\"
        $currentPath = $Env:PATH
        Set-Content -Path $env:GITHUB_PATH -Value "$newPath;$currentPath"

        echo "Set the PATH environment variable to:"
        echo "$newPath;$currentPath"

        # From: https://docs.rs/system-deps/6.2.2/system_deps/index.html
        echo "SYSTEM_DEPS_BUILD_INTERNAL=always" >> $env:GITHUB_ENV
        echo "SYSTEM_DEPS_LINK=static" >> $env:GITHUB_ENV

    - name: where gcc
      run: |
        echo $Env:PATH
        echo $(where gcc)

      # Everything after this step is within the "Developer Command Prompt for Microsoft Visual C++".
      # This is required for dav1d to build correctly, using msvc
    - name: Build the executable
      run: |
        echo $Env:PATH
        # Get-Command gcc

        # ---------------------------------------------------------
        # Remove from the PATH the god damn gcc toolchains and
        # other shit that conflict with building dav1d with msvc

        $pathsToRemove = @("C:\Program Files\Git\bin;", "C:\Program Files\Git\mingw64\bin;", "C:\mingw64\bin;", "C:\Strawberry\c\bin;", "C:\Program Files\LLVM\bin;")

        # Read the content of the file
        $content = $Env:PATH

        # Loop through each path to remove
        foreach ($path in $pathsToRemove) {
          # Remove lines containing the path (case-insensitive)
          $content = $content -ireplace [regex]::Escape("$path"), ""
        }
        # Set-Content -Path $env:GITHUB_PATH -Value $content
        echo "Wrote the following path"
        echo $content
        $Env:PATH = $content

        # dav1d-sys 0.8.3 builds dav1d 1.5.0, which MSVC 14.52 rejects (error C7780 in
        # include/compat/msvc/stdatomic.h, fixed in dav1d 1.5.5). Build 1.5.5 here and
        # let system-deps find it through pkg-config instead.
        $dav1dSrc = "$Env:RUNNER_TEMP\dav1d"
        $dav1dPrefix = "$Env:RUNNER_TEMP\dav1d-install"
        git clone --depth 1 -b 1.5.5 https://code.videolan.org/videolan/dav1d.git $dav1dSrc
        if ($LASTEXITCODE -ne 0) { exit 1 }
        meson setup -Ddefault_library=static -Denable_tools=false -Denable_tests=false --prefix $dav1dPrefix "$dav1dSrc\build" $dav1dSrc
        if ($LASTEXITCODE -ne 0) { exit 1 }
        # meson compile, not ninja: meson activates the MSVC environment it configured with.
        meson compile -C "$dav1dSrc\build"
        if ($LASTEXITCODE -ne 0) { exit 1 }
        meson install -C "$dav1dSrc\build"
        if ($LASTEXITCODE -ne 0) { exit 1 }
        $Env:PKG_CONFIG_PATH = "$dav1dPrefix\lib\pkgconfig"
        $Env:SYSTEM_DEPS_DAV1D_BUILD_INTERNAL = "never"

        cargo build --release --locked --features=networking,avif

    - name: Copy executable to distributable folder
      working-directory: ./distribution/windows/
      shell: cmd
      run: |
        mkdir program
        copy /y ..\..\target\release\emulsion.exe program\emulsion.exe
    - name: Create installer
      working-directory: ./distribution/windows/
      shell: pwsh
      run: |
        makensis /DVERSION=$Env:EMULSION_VERSION emulsion.nsi
        Move-Item -Force Emulsion-Installer.exe $Env:INSTALLER_NAME
    - name: Upload Windows package
      uses: actions/upload-artifact@v4
      with:
        name: windows-package
        path: distribution/windows/${{ env.INSTALLER_NAME }}
        if-no-files-found: error

  osx:
    # macos-14 has been retired; macos-latest is the arm64 image the tests run on.
    runs-on: macos-latest
    needs: test
    env:
      INSTALLER_NAME: ${{ format('Emulsion-OSX-{0}.dmg', github.ref_name) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-darwin,x86_64-apple-darwin
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install cargo bundle
      run: cargo install cargo-bundle --version 0.11.0 --locked
    - name: Install avif build dependencies (macOS)
      run: brew install meson ninja nasm
    - name: Install create-dmg
      run: npm install --global create-dmg@8.1.0
    - name: Build macOS Universal 2 package
      run: ./distribution/macos/create_dmg.sh
    - name: Rename .dmg
      run: mv Emulsion.dmg "$INSTALLER_NAME"
    - name: Upload macOS package
      uses: actions/upload-artifact@v4
      with:
        name: macos-package
        path: ${{ env.INSTALLER_NAME }}
        if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    needs: test
    env:
      EMULSION_VERSION: ${{ github.ref_name }}
      INSTALLER_NAME: ${{ format('Emulsion-Linux-{0}.deb', github.ref_name) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install cargo bundle
      run: cargo install cargo-bundle --version 0.11.0 --locked
    - name: Install avif build dependencies (linux)
      run: |
        DEBIAN_FRONTEND=noninteractive sudo apt-get update
        DEBIAN_FRONTEND=noninteractive sudo apt-get install -y ninja-build nasm meson
    - name: Setup dav1d - avif dependency (linux)
      env:
        DAV1D_DIR: dav1d_dir
        LIB_PATH: lib/x86_64-linux-gnu
      run: |
        echo "SYSTEM_DEPS_DAV1D_LINK=static" >> $GITHUB_ENV
        echo "SYSTEM_DEPS_DAV1D_BUILD_INTERNAL=always" >> $GITHUB_ENV
    - name: Create deb package
      # `cargo bundle` has no --locked flag, so build with --locked first and make bundling
      # skip its own (unlocked) `cargo build`.
      run: |
        cargo build --release --locked --features=avif
        CARGO_BUNDLE_SKIP_BUILD=1 cargo bundle --release --features=avif
    - name: Rename .deb
      run: |
        mv target/release/bundle/deb/*.deb "$INSTALLER_NAME"
    - name: Upload Linux package
      uses: actions/upload-artifact@v4
      with:
        name: linux-package
        path: ${{ env.INSTALLER_NAME }}
        if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, osx, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download package artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets
        merge-multiple: true
    - name: Publish draft GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: true
        prerelease: false
        files: release-assets/**
